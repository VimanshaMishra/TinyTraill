spring.application.name=TinyTrail

#TinyTrail ? tiny links, big path.

spring.datasource.url= ${DATABASE_URL}
spring.datasource.username= ${DATABASE_USERNAME}
spring.datasource.password= ${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform= ${DATABASE_DIALECT}


jwt_expiration = ${JWT_EXPIRATION}
jwt_secret = ${JWT_SECRET}
FRONTEND_URL = ${FRONTEND_URL}


# DEBUG logs authentication internals; opt in per environment instead of defaulting to it.
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}



